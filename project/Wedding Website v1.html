<style>
  :root{
    --burgundy:#4A1A2C;
    --magenta:#A8326B;
    --blush:#D4A5A5;
    --plum:#5B2A4A;
    --cream:#F4EDE4;
    --cream-deep:#EDE3D4;
    --ink:#1A1416;
    --ink-soft:#2A2024;
    --rule:rgba(26,20,22,0.18);
    --rule-soft:rgba(26,20,22,0.10);
  }
  *{ box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html,body{ margin:0; padding:0; background:var(--cream); color:var(--ink); font-family:'Inter',system-ui,sans-serif; font-weight:400; }
  body{ overflow-x:hidden; }
  ::selection{ background:var(--burgundy); color:var(--cream); }
  a{ color:inherit; }
  .serif{ font-family:'Cormorant Garamond',Georgia,serif; }
  .mono-eyebrow{
    font-family:'Inter',sans-serif;
    font-weight:500;
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
  }
  /* image-slot styling override for editorial look */
  image-slot{
    --slot-bg: rgba(26,20,22,0.04);
    --slot-border: rgba(26,20,22,0.18);
    --slot-color: rgba(26,20,22,0.55);
    --slot-font: 'Inter', sans-serif;
  }
  image-slot[data-on-dark]{
    --slot-bg: rgba(244,237,228,0.05);
    --slot-border: rgba(244,237,228,0.22);
    --slot-color: rgba(244,237,228,0.65);
  }
  /* utility */
  .hidden{ display:none !important; }
  /* Loading fallback */
  #__loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--cream); color:var(--ink); font-family:'Cormorant Garamond',serif; font-style:italic;
    z-index:9999; font-size:18px; opacity:0.6;
  }
</style>
