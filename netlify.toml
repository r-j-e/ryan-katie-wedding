# Netlify build settings.
# No build step — this is a static site that uses React + Babel via CDN.
# Netlify will just publish the repo root as-is.

[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Belt-and-braces on top of the meta tag + robots.txt
    X-Robots-Tag = "noindex, nofollow"
