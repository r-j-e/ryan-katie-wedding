<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<title>Ryan &amp; Katie · 2 July 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500&family=Cormorant+Garamond:ital,wght@0,400;1,300;1,400&display=swap" rel="stylesheet" />
<!-- Amoresa is critical for the names lockup on the gate (first paint).
     Preload it so it isn't blocked behind the React bundle. -->
<link rel="preload" href="fonts/Amoresa.ttf" as="font" type="font/ttf" crossorigin />
<style>
  /* Amoresa — your licensed font, served from the project. */
  @font-face {
    font-family: 'Amoresa';
    src: url('fonts/Amoresa.ttf') format('truetype');
    font-weight: 400;
    font-style: normal;
    font-display: swap;
  }
</style>
<style>
  :root{
    --burgundy:#4A1A2C;
    --burgundy-soft:#6B3147;
    --magenta:#A8326B;
    --blush:#D4A5A5;
    --cream:#F4EDE4;
    --cream-deep:#EDE3D4;
    --paper:#FAF6EF;
    --ink:#1A1416;
    --ink-soft:#2A2024;
    --ink-mute:rgba(26,20,22,0.55);
    --rule:rgba(26,20,22,0.14);
    --rule-soft:rgba(26,20,22,0.08);
    /* Aubergine→magenta gradient pulled from the calla-lily bouquet —
       used as a text fill on the most decorative burgundy accents. */
    --accent-gradient: linear-gradient(135deg, var(--burgundy) 0%, var(--magenta) 100%);
  }
  .accent-gradient{
    background-image: var(--accent-gradient);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: transparent;
  }
  *{ box-sizing:border-box; -webkit-font-smoothing:antialiased; }
  html,body{
    margin:0; padding:0;
    background:var(--cream); color:var(--ink);
    font-family:'Cinzel', Georgia, serif;
    font-weight:400;
  }
  body{ overflow-x:hidden; }
  ::selection{ background:var(--burgundy); color:var(--cream); }
  a{ color:inherit; }
  /* Body serif. Cormorant Garamond has real italics and real lowercase
     glyphs; Cinzel is a caps-only display face, so anything tagged
     .serif with fontStyle:italic must NOT use Cinzel — synthetic
     italics on small-caps render harsh and almost-uppercase. */
  .serif{ font-family:'Cormorant Garamond', Georgia, serif; }
  /* === The wedding-name treatment ===
     Capital letters in Amoresa script (the user's licensed font, served
     from /fonts/Amoresa.ttf). The rest of the word in Cinzel caps —
     matches the printed Canva invite.
  */
  :root{
    --script-family: 'Amoresa', 'Allura', cursive;
    --caps-family:   'Cinzel', 'Trajan Pro', Georgia, serif;
  }
  .script{
    font-family: var(--script-family);
    font-weight:400;
    /* Big and dramatic — the script must dominate the Cinzel caps that
       follow, like a hand-lettered initial on the printed invite. */
    font-size:1.75em;
    line-height:0.95;
    /* Small positive gap so the script swash doesn't crash into the caps. */
    margin-right:0.06em;
    color: inherit;
  }
  .script.amp{
    /* Solid burgundy ampersand — the only accent in the wordmark.
       We tried background-clip:text gradient here, but the Amoresa
       swashes extend so far beyond the em-box that any line-height
       big enough to avoid clipping made the lockup look bloated.
       Gradient lives on the other accents (02, schedule times,
       monograms, etc.); the & stays solid. */
    color: var(--burgundy);
    /* Generous breathing room around the ampersand on the inline lockup. */
    margin: 0 0.32em;
  }
  .caps{
    font-family: var(--caps-family);
    text-transform:uppercase;
    /* Invite has very tight Cinzel — almost touching. */
    letter-spacing:0.04em;
    font-weight:400;
  }
  /* Inline (one-line) */
  .script-name{
    display:inline-block;
    white-space:nowrap;
    line-height:1;
  }
  /* Stacked (Katie / & / Ryan) — matches the invite */
  .script-name.stacked{
    display:inline-flex;
    flex-direction:column;
    align-items:center;
    line-height:1;
  }
  .script-name.stacked .line{ display:block; white-space:nowrap; }
  .script-name.stacked .ampline{
    /* Tuck the ampersand up between the names. The descenders of the
       upper name and the ascenders of the lower name will interleave. */
    margin:-0.22em 0 -0.10em;
  }
  .script-name.stacked .ampline .script{
    font-size:1.1em;  /* slightly smaller than the names */
  }
  .label{
    font-family:'Cinzel', Georgia, serif;
    font-weight:400;
    font-size:11px;
    letter-spacing:0.28em;
    text-transform:uppercase;
    color: var(--ink-mute);
  }
  /* image-slot defaults — plain cream block with faint outline + tiny label */
  image-slot{
    --slot-bg: var(--cream-deep);
    --slot-border: rgba(26,20,22,0.10);
    --slot-color: rgba(26,20,22,0.40);
    --slot-font: 'Inter', sans-serif;
  }
  /* utility */
  .hidden{ display:none !important; }
  #__loading{
    position:fixed; inset:0; display:flex; align-items:center; justify-content:center;
    background:var(--cream); color:var(--ink-mute);
    font-family:'Cinzel', Georgia, serif;
    z-index:9999; font-size:18px;
  }
</style>
</head>
<body>
  <div id="__loading">a moment…</div>
  <div id="root"></div>

  <script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin="anonymous"></script>

  <script src="image-slot.js"></script>
  <script src="dist/gate.js"></script>
  <script src="dist/sections.js"></script>
  <script src="dist/rsvp.js"></script>
  <script src="dist/app.js"></script>
</body>
</html>
